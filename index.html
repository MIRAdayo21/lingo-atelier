  const builtins=[...Object.entries(DATA).flatMap(([deck,list])=>list.map((v,i)=>({id:deck+'-'+i,lang:'en',deck,front:v[0],back:v[1],example:v[2]}))),...Object.entries(DATA_KO).flatMap(([deck,list])=>list.map((v,i)=>({id:'ko-'+deck+'-'+i,lang:'ko',deck,front:v[0],back:v[1],example:v[2]})))];
  const STORAGE='lingo-atelier-v1';
  const blank=()=>({version:2,course:'en',progress:{},events:[],custom:[],goal:10});
  let data=load(),view='home',selectedMode='cards',selectedDeck='all',session=null,search='',libraryDeck='all',modal=null,toastTimer=0;
  course=data.course==='ko'?'ko':'en';DECKS=course==='ko'?DECKS_KO:DECKS_EN;
  function load(){try{const v=JSON.parse(localStorage.getItem(STORAGE));if(v&&[1,2].includes(v.version)&&v.progress&&typeof v.progress==='object'&&!Array.isArray(v.progress)&&Array.isArray(v.events)&&Array.isArray(v.custom)){return {...blank(),...v,version:2,course:v.course==='ko'?'ko':'en',custom:v.custom.map(c=>({...c,lang:c.lang==='ko'?'ko':'en'})),events:v.events.map(e=>({...e,lang:e.lang==='ko'?'ko':'en'})),goal:Math.max(1,Math.min(100,Number(v.goal)||10))}}}catch(e){}return blank()}
  function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(data))}catch(e){toast('保存に失敗しました。ブラウザのストレージ設定を確認してください。')}}
  function allCards(){return builtins.concat(data.custom).filter(c=>c.lang===course)}
  function courseEvents(){return data.events.filter(e=>e.lang===course)}
  function switchCourse(lang){if(!COURSES[lang]||lang===course)return;course=lang;DECKS=lang==='ko'?DECKS_KO:DECKS_EN;data.course=lang;selectedDeck='all';libraryDeck='all';selectedMode='cards';session=null;modal=null;search='';persist();go('home');toast(COURSES[lang].name+'コースに切り替えました')}
  const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
  function dateOffset(d,n){const parts=d.split('-').map(Number);const t=new Date(parts[0],parts[1]-1,parts[2]+n);return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`}
  function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function getProgress(id){return data.progress[id]||{n:0,interval:0,ease:2.5,due:today(),correct:0,wrong:0}}
  function learned(c){return (data.progress[c.id]?.n||0)>0}
  function due(c){const p=data.progress[c.id];return !!p&&p.n>0&&p.due<=today()}
  function reviewedToday(){return courseEvents().filter(e=>e.date===today()).length}
  function streak(){const dates=new Set(courseEvents().map(e=>e.date));let x=today();if(!dates.has(x))x=dateOffset(x,-1);let n=0;while(dates.has(x)){n++;x=dateOffset(x,-1)}return n}
  function countLearned(){return allCards().filter(learned).length}
  function answeredRatio(){const events=courseEvents(),total=events.length;return total?Math.round(100*events.filter(e=>e.correct).length/total):0}
  function selectDeckCards(deck){return allCards().filter(c=>deck==='all'||c.deck===deck)}
  function todayActivities(){const t=today();return Array.from({length:7},(_,i)=>{const date=dateOffset(t,i-6);return {date,count:courseEvents().filter(e=>e.date===date).length}})}
  function toast(msg){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.appendChild(e);clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),3000)}
  function go(v){view=v;session=null;modal=null;search='';render();window.scrollTo({top:0,behavior:'instant'})}
  function courseButtons(){return Object.entries(COURSES).map(([id,c])=>`<button type="button" data-course="${id}" class="course-btn ${course===id?'active':''}" aria-pressed="${course===id}">${id==='ko'?'🇰🇷':'🇬🇧'} ${c.name}</button>`).join('')}
  function shell(inner){let nav=[['home','ホーム'],['learn','学習する'],['library','単語帳'],['stats','学習記録'],['settings','設定']];return `<div class="app"><aside class="sidebar"><div class="brand"><div class="brandmark"><span>あ</span></div> lingo<span style="color:var(--primary)">.</span></div><div class="sidelabel">MY WORKSPACE</div><nav class="nav">${nav.map(([id,label])=>`<button class="navbutton ${view===id?'active':''}" data-nav="${id}"><span class="navicon">${ICONS[id]}</span>${label}</button>`).join('')}</nav><div class="sidebottom"><b>Small steps, big progress.</b><p>1日少しずつ。忘れる前に、もう一度。</p><button data-nav="settings">学習設定を見る →</button></div></aside><main class="main"><header class="mobile-header"><div class="brand"><div class="brandmark"><span>あ</span></div> lingo<span style="color:var(--primary)">.</span></div><div class="course-switch mobile-course" role="group" aria-label="学習する言語">${courseButtons()}</div></header><div class="topline"><div><div class="eyebrow">YOUR LANGUAGE JOURNEY</div><div class="welcome">自分のペースで、今日も少し前へ。</div></div><div class="topright"><div class="course-switch desktop-course" role="group" aria-label="学習する言語">${courseButtons()}</div><div class="pill">♨ ${streak()}日連続</div></div></div>${inner}<div class="copyright">LINGO ATELIER · Local-first language learning · データはこのブラウザに保存されます</div></main></div><nav class="mobile-nav">${nav.map(([id,label])=>`<button class="${view===id?'active':''}" data-nav="${id}"><span>${ICONS[id]}</span>${label}</button>`).join('')}</nav>`}
  function activityChart(){const a=todayActivities(),max=Math.max(6,...a.map(x=>x.count));return `<div class="activity-bars">${a.map((x,i)=>`<div class="activity-col"><div class="activity-barwrap"><div class="activity-bar ${i===6?'current':''}" style="height:${Math.max(5,(x.count/max)*100)}%" title="${x.date}: ${x.count}問"></div></div><span>${['日','月','火','水','木','金','土'][new Date(x.date+'T12:00:00').getDay()]}</span></div>`).join('')}</div>`}
  function deckCard(d){const cards=selectDeckCards(d.id);return `<article class="deck-card"><div class="deckcard-left"><div class="deck-emblem" style="background:${d.color}">${d.icon}</div><div><h3>${d.name}</h3><p>${cards.length} 枚のカード · ${cards.filter(learned).length} 枚を学習済み</p></div></div><button class="circlearrow" aria-label="${d.name}で学ぶ" data-deck-start="${d.id}">→</button></article>`}
  function personalPlan(){
    const steps=course==='ko'?

  function homePage(){const total=allCards().length,done=reviewedToday(),pc=Math.min(100,done/data.goal*100),remaining=allCards().filter(c=>due(c)).length;return `<section class="hero"><div class="hero-content"><div class="hero-label">✦ LET'S KEEP LEARNING</div><h1>${course==='ko'?'読めるハングルを、<br>理解できる韓国語に。':'分かる英語を、<br>使える英語に。'}</h1><p>覚えて、思い出して、少しずつ使える${COURSES[course].name}に。<br>${course==='ko'?'文字の練習はスキップ。助詞・動詞の活用・短文読解から。':'日常会話やSNSの理解を活かし、時制・語順・前置詞のあいまいさをなくそう。'}</p><button class="btn btn-hero" data-action="quick-start">おすすめの練習を始める →</button></div><div class="hero-art"><div class="art-circle">✺</div><div class="art-bubble">${course==='ko'?'안녕하세요!':'Hello!'}</div><div class="art-bubble art-bubble2">こんにちは</div></div></section><div class="grid-stats"><div class="stat-card"><div class="stat-label">今日の学習<span class="stat-icon">↗</span></div><div class="stat-value">${done}<span>/ ${data.goal} 問</span></div></div><div class="stat-card"><div class="stat-label">学習済み<span class="stat-icon">▣</span></div><div class="stat-value">${countLearned()}<span>/ ${total} 枚</span></div></div><div class="stat-card"><div class="stat-label">復習待ち<span class="stat-icon">◷</span></div><div class="stat-value">${remaining}<span>枚</span></div></div></div>${personalPlan()}<div class="section-head"><h2>学習ダッシュボード</h2><button class="textlink" data-nav="stats">詳しく見る →</button></div><div class="two-col"><div class="panel"><div class="panel-head"><h3>今日の目標</h3><span style="font-size:12px;color:var(--primary);font-weight:800">${Math.round(pc)}%</span></div><div class="progress-meta"><span>${done>=data.goal?'目標達成！':'あと '+Math.max(0,data.goal-done)+' 問で達成'}</span><strong>${done} / ${data.goal}</strong></div><div class="progressbar"><div style="width:${pc}%"></div></div><p class="muted" style="margin-bottom:0">${done>=data.goal?'今日は十分がんばりました。続けて学習してもOK。':'続けることが一番大切。少しずつ積み上げましょう。'}</p></div><div class="panel"><div class="panel-head"><h3>この7日間</h3><span style="font-size:12px;color:var(--muted)">${todayActivities().reduce((s,a)=>s+a.count,0)} 問</span></div>${activityChart()}</div></div><div class="section-head"><h2>カテゴリーから学ぶ</h2><button class="textlink" data-nav="library">単語帳を見る →</button></div><div class="deck-grid">${DECKS.filter(d=>d.id!=='custom'&&(course!=='ko'||d.id!=='hangul')).map(deckCard).join('')}</div>`}
  function startPage(){return `<div class="page-title"><h1>今日は何を学ぶ？</h1><p>カードで記憶、クイズで確認、入力で定着。好きな方法を選べます。</p></div><div class="section-head"><h2>学習モードを選択</h2></div><div class="learning-setup">${[['cards','フラッシュカード','単語をめくって確認し、理解度に合わせて次の復習日を調整。','▤'],['output','思い出して話す','日本語から英語・韓国語を自分で考えてから答えを確認。','↗'],['quiz','4択クイズ','表示された${COURSES[course].name}に対応する日本語を選んで覚える。','◉'],['typing','タイピング','日本語を見て、学習中の言語で入力して答える。','⌨']].map(([id,name,desc,icon])=>`<button class="setup-card ${selectedMode===id?'selected':''}" data-mode="${id}"><span class="setup-icon">${icon}</span><h3>${name}</h3><p>${desc}</p>${selectedMode===id?'<span class="selected-mark">✓</span>':''}</button>`).join('')}</div><div class="setup-bottom"><div class="form-group"><label for="study-deck">学習するカテゴリー</label><select id="study-deck" class="form-select">${[['all','すべてのカテゴリー'],...DECKS.map(d=>[d.id,d.name])].map(([id,name])=>`<option value="${id}" ${selectedDeck===id?'selected':''}>${name}</option>`).join('')}</select></div><button class="btn" data-action="start-session">${selectedMode==='cards'?'カードで学ぶ':selectedMode==='output'?'思い出す練習を始める':selectedMode==='quiz'?'クイズを始める':'入力練習を始める'} →</button></div><div class="panel"><h3>${course==='ko'?'韓国語の学習について':'復習の仕組み'}</h3><p class="muted" style="margin-bottom:0">${course==='ko'?'ハングルが読めるなら『文法・助詞』から開始。ハングル入門は任意で、タイピングには韓国語キーボードが必要です。':''}覚えているカードは数日後、忘れたカードは翌日に再登場します。復習が必要なカードを優先し、未学習カードも出題します。</p></div>`}
  function pickSession(mode,deck){const cards=selectDeckCards(deck),rev=cards.filter(due).sort((a,b)=>getProgress(a.id).due.localeCompare(getProgress(b.id).due)),unseen=cards.filter(c=>!learned(c)),others=cards.filter(c=>learned(c)&&!due(c)).sort((a,b)=>getProgress(a.id).due.localeCompare(getProgress(b.id).due));let list=[...rev,...unseen].slice(0,10);if(mode!=='cards'&&list.length<10)list=list.concat(others.slice(0,10-list.length));return list}
  function begin(mode=selectedMode,deck=selectedDeck){const cards=pickSession(mode,deck);if(!cards.length){toast('今のカテゴリーには出題できるカードがありません。');go('learn');return}selectedMode=mode;selectedDeck=deck;session={mode,deck,ids:cards.map(c=>c.id),index:0,flipped:false,answered:false,selection:-1,answer:'',correct:0};view='learn';render();window.scrollTo({top:0,behavior:'instant'})}
  function currentCard(){return allCards().find(c=>c.id===session?.ids[session.index])}
  function studyPage(){if(!session)return startPage();if(session.index>=session.ids.length)return completePage();const c=currentCard(),s=session,percent=Math.round(100*s.index/s.ids.length),code=COURSES[course].code;if(!c)return '<div class="empty">カードを表示できません。</div>';let central='';
    if(s.mode==='cards'||s.mode==='output'){central=`<div class="flashcard" role="group" aria-label="フラッシュカード"><span class="cardtop">${esc(DECKS.find(d=>d.id===c.deck)?.name||'MY WORDS')} · ${s.mode==='output'?'JA → '+code:code+' → JA'}</span><button class="speak" data-action="speak" title="発音する" aria-label="${COURSES[course].name}を読み上げる">♪</button><div class="word">${esc(s.mode==='output'?c.back:c.front)}</div><div class="phonetic">${s.flipped?'答えを確認しました':s.mode==='output'?'学習中の言語で声に出してみよう':'意味を思い出してから答えを見る'}</div>${s.flipped?`<div class="translation">${esc(s.mode==='output'?c.front:c.back)}</div>${c.example?`<div class="example">${esc(c.example)}</div>`:''}`:''}</div>${s.flipped?`<p class="study-hint">どのくらい覚えていましたか？<span class="shortcut"> （1〜4キーでも選択可）</span></p><div class="answer-buttons">${[['again','もう一度','明日'],['hard','難しい','1〜2日'],['good','覚えた','間隔を伸ばす'],['easy','簡単','長めに復習']].map(([id,name,subtitle])=>`<button data-rate="${id}">${name}<span>${subtitle}</span></button>`).join('')}</div>`:`<button class="btn full" style="margin-top:15px" data-action="flip">答えを見る <span class="shortcut" style="color:inherit">Space</span></button>`}`}
    else if(s.mode==='quiz'){
      const opts=quizOptions(c);central=`<div class="flashcard" style="min-height:232px"><span class="cardtop">4択 · ${code} → JA</span><button class="speak" data-action="speak" aria-label="${COURSES[course].name}を読み上げる">♪</button><div class="word">${esc(c.front)}</div><div class="phonetic">正しい意味を選択してください</div></div><div class="quiz-options">${opts.map((x,i)=>`<button class="quiz-option ${s.answered?(x===c.back?'correct':s.selection===i?'incorrect':''):''}" data-choice="${i}" ${s.answered?'disabled':''}>${esc(x)}</button>`).join('')}</div>${s.answered?`<div class="feedback ${s.answer==='correct'?'':'error'}">${s.answer==='correct'?'✓ 正解です！':'答え：'+esc(c.back)}${c.example?`<br><span style="color:#72778a">${esc(c.example)}</span>`:''}</div><button class="btn full" data-action="next" style="margin-top:14px">次の問題 →</button>`:''}`}
    else{central=`<div class="flashcard" style="min-height:245px"><span class="cardtop">タイピング · JA → ${code}</span><div class="word" style="font-size:clamp(20px,4vw,33px)">${esc(c.back)}</div><div class="phonetic">対応する${COURSES[course].name}を入力してください</div></div><form id="typing-form" class="type-answer"><input id="answer-input" class="form-input" aria-label="${COURSES[course].name}の答え" placeholder="${COURSES[course].name}で入力..." autocomplete="off" autocapitalize="off" spellcheck="false" ${s.answered?'disabled':''} value="${esc(s.typed||'')}"/><button class="btn" type="submit" ${s.answered?'disabled':''}>答える</button></form>${s.answered?`<div class="feedback ${s.answer==='correct'?'':'error'}">${s.answer==='correct'?'✓ 正解です！':'正解：'+esc(c.front)}${c.example?`<br><span style="color:#72778a">${esc(c.example)}</span>`:''}</div><button class="btn full" data-action="next" style="margin-top:14px">次の問題 →</button>`:''}`}
    return `<div class="page-title"><h1>${s.mode==='cards'?'フラッシュカード':s.mode==='output'?'思い出して話す':s.mode==='quiz'?'4択クイズ':'タイピング練習'}</h1><p>${COURSES[course].name}コース · 答えを思い出してから進みましょう。</p></div><div class="study-layout"><div class="study-top"><span>${s.index+1} / ${s.ids.length} 問</span><button class="textlink" data-action="leave">学習を終了 ×</button></div><div class="study-progress"><div style="width:${percent}%"></div></div>${central}</div>`}
  function quizOptions(card){const cards=allCards().filter(c=>c.id!==card.id&&c.back!==card.back);let arr=cards.slice().sort((a,b)=>hash(card.id+a.id)-hash(card.id+b.id)).slice(0,3).map(c=>c.back);arr.push(card.back);return arr.sort((a,b)=>hash(card.id+'!'+a)-hash(card.id+'!'+b))}
  function hash(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0}
  function normalize(s){return s.normalize('NFKC').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/[.!?。！？,，]+$/,'').replace(/\s+/g,' ')}
  function assess(id,rating){const p={...getProgress(id)};const oldInterval=p.interval;const oldN=p.n||0;if(rating==='again'){p.n=oldN+1;p.interval=1;p.ease=Math.max(1.3,(p.ease||2.5)-.2);p.wrong=(p.wrong||0)+1}else if(rating==='hard'){p.n=oldN+1;p.interval=Math.max(1,Math.round(oldInterval?oldInterval*1.2:2));p.ease=Math.max(1.3,(p.ease||2.5)-.15);p.correct=(p.correct||0)+1}else if(rating==='good'){p.n=oldN+1;p.interval=oldInterval?Math.max(oldInterval+1,Math.round(oldInterval*(p.ease||2.5))):3;p.correct=(p.correct||0)+1}else{p.n=oldN+1;p.interval=oldInterval?Math.max(oldInterval+2,Math.round(oldInterval*(p.ease||2.5)*1.3)):5;p.ease=Math.min(3.2,(p.ease||2.5)+.1);p.correct=(p.correct||0)+1}p.due=dateOffset(today(),Math.min(365,p.interval));p.last=today();data.progress[id]=p;data.events.push({date:today(),id,correct:rating!=='again',mode:session?.mode||'cards',lang:course});if(data.events.length>20000)data.events=data.events.slice(-20000);persist()}
  function answerCard(rate){if(!session?.flipped)return;assess(currentCard().id,rate);session.correct+=rate!=='again'?1:0;session.index++;session.flipped=false;render()}
  function selectAnswer(i){if(!session||session.answered)return;const c=currentCard(),opts=quizOptions(c),right=opts[i]===c.back;session.selection=i;session.answered=true;session.answer=right?'correct':'incorrect';session.correct+=right?1:0;assess(c.id,right?'good':'again');render()}
  function typeAnswer(){if(!session||session.answered)return;const el=document.getElementById('answer-input');let typed=el?.value||'';if(!typed.trim()){toast(COURSES[course].name+'を入力してください');return}const c=currentCard(),right=normalize(typed)===normalize(c.front);session.typed=typed;session.answered=true;session.answer=right?'correct':'incorrect';session.correct+=right?1:0;assess(c.id,right?'good':'again');render()}
  function next(){if(!session?.answered)return;session.index++;session.answered=false;session.selection=-1;session.answer='';session.typed='';render();if(session?.mode==='typing')document.getElementById('answer-input')?.focus()}

  function libraryPage(){const cards=allCards().filter(c=>(libraryDeck==='all'||libraryDeck===c.deck)&&(`${c.front} ${c.back} ${c.example||''}`.toLowerCase().includes(search.toLowerCase())));const visible=cards.slice(0,250);return `<div class="page-title"><h1>あなたの単語帳</h1><p>すべてのカードを確認できます。自分の言葉も追加して、学びたい内容を増やしましょう。</p></div><div class="page-actions"><div style="display:flex;gap:10px;flex:1;min-width:230px"><input class="form-input" id="library-search" placeholder="${COURSES[course].name}・日本語から検索" value="${esc(search)}" aria-label="単語を検索"/><select class="form-select" style="max-width:190px" id="library-filter"><option value="all">すべて</option>${DECKS.map(d=>`<option value="${d.id}" ${libraryDeck===d.id?'selected':''}>${d.name}</option>`).join('')}</select></div><button class="btn" data-action="add-card">＋ 単語を追加</button></div><div class="muted" style="margin-bottom:12px">${cards.length} 枚のカード</div><div class="library-list">${visible.length?visible.map(c=>`<article class="library-row"><div style="min-width:0"><div class="library-word">${esc(c.front)}</div><div class="library-sub">${esc(c.back)}${c.example?`<br>${esc(c.example)}`:''}</div></div><div class="library-right"><span class="tag ${due(c)?'due':learned(c)?'ok':''}">${due(c)?'復習待ち':learned(c)?'学習済み':'未学習'}</span><button class="icon-button" data-speak="${esc(c.id)}" title="読み上げ" aria-label="${esc(c.front)} を読み上げ">♪</button>${c.deck==='custom'?`<button class="icon-button" data-delete="${esc(c.id)}" title="削除" aria-label="${esc(c.front)} を削除">×</button>`:''}</div></article>`).join(''):'<div class="empty">該当するカードがありません。</div>'}</div>`}
  function statsPage(){const total=allCards().length,mastered=allCards().filter(c=>getProgress(c.id).interval>=7).length,learn=countLearned(),rate=total?Math.round(learn/total*100):0;const top=DECKS.map(d=>{const cs=selectDeckCards(d.id);return {name:d.name,total:cs.length,done:cs.filter(learned).length}}).filter(d=>d.total);return `<div class="page-title"><h1>学習の記録</h1><p>小さな積み重ねを数字で確認。がんばりはこのブラウザに保存されます。</p></div><div class="grid-stats"><div class="stat-card"><div class="stat-label">累計回答数</div><div class="stat-value">${courseEvents().length}<span>問</span></div></div><div class="stat-card"><div class="stat-label">正答・習得評価率</div><div class="stat-value">${answeredRatio()}<span>%</span></div></div><div class="stat-card"><div class="stat-label">連続学習</div><div class="stat-value">${streak()}<span>日</span></div></div></div><div class="section-head"><h2>学習分析</h2></div><div class="stats-grid"><section class="panel"><div class="panel-head"><h3>単語の学習状況</h3></div><div class="mastery"><div class="donut" style="--pct:${rate}%" data-label="${rate}%"></div><div><div class="big-number">${learn} <span style="font-size:13px;color:var(--muted);font-weight:600">/ ${total} 枚</span></div><p class="muted">学習済みカード<br>うち復習間隔7日以上：${mastered} 枚</p></div></div></section><section class="panel"><div class="panel-head"><h3>直近7日間の学習</h3><span class="muted">${todayActivities().reduce((s,a)=>s+a.count,0)} 問</span></div>${activityChart()}</section></div><div class="section-head"><h2>カテゴリー別の進捗</h2></div><section class="panel">${top.length?top.map((d,i)=>`<div style="margin:${i===0?'0':'18px'} 0 0"><div class="progress-meta"><strong>${d.name}</strong><span>${d.done} / ${d.total} 枚</span></div><div class="progressbar"><div style="width:${d.done/d.total*100}%"></div></div></div>`).join(''):'<div class="muted">カードがありません。</div>'}</section><p class="muted" style="margin-top:16px">※ 正答率にはフラッシュカードの自己評価も含まれます。学習進捗は学力の正式な測定ではありません。</p>`}
  function settingsPage(){return `<div class="page-title"><h1>設定とデータ管理</h1><p>学習目標の変更、データのバックアップ・復元ができます。</p></div><div class="section-head"><h2>学習設定</h2></div><div class="settings-grid"><section class="panel"><h3>1日の学習目標</h3><p class="muted">1日に何問取り組むか設定します。</p><div class="form-group" style="max-width:210px"><label for="daily-goal">1日の目標回答数</label><select class="form-select" id="daily-goal">${[5,10,15,20,30,50,100].map(n=>`<option value="${n}" ${data.goal===n?'selected':''}>${n} 問</option>`).join('')}</select></div></section><section class="panel"><h3>音声読み上げ</h3><p class="muted">端末やブラウザが対応していれば、${COURSES[course].name}の発音を再生します。音声機能は端末側の仕組みを利用するため、声の種類やオフライン利用可否は環境によって異なります。</p><button class="btn btn-soft small" data-action="test-speech">${COURSES[course].name}の音声をテスト ♪</button></section></div><div class="section-head"><h2>バックアップと復元</h2></div><div class="settings-grid"><section class="panel"><h3>学習データを保存</h3><p class="muted">単語の追加、学習状況、履歴をJSONファイルに書き出します。別の端末に移すときに便利です。</p><button class="btn btn-white small" data-action="export-data">↓ JSONをダウンロード</button></section><section class="panel"><h3>バックアップから復元</h3><p class="muted">保存したJSONファイルを選択してデータを復元します。現在の記録は上書きされます。</p><button class="btn btn-white small" data-action="import-data">↑ JSONを読み込む</button><input id="import-file" type="file" accept=".json,application/json" hidden /></section></div><div class="section-head"><h2>その他</h2></div><section class="panel"><h3>データの保存先</h3><p class="muted">サーバーへの通信・アカウント登録はありません。データはこのブラウザ内（localStorage）に保存されます。プライベートブラウズ、キャッシュ削除、別端末への移動で消える場合があるため、必要に応じてバックアップしてください。</p><button class="btn btn-danger small" data-action="reset-data">すべての学習データを初期化</button></section>`}
  function modalPage(){if(modal==='add')return `<div class="modal-backdrop" data-backdrop="true"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">新しい単語を追加</h2><button class="icon-button" data-action="close-modal" aria-label="閉じる">×</button></div><form id="add-form"><div class="form-group"><label for="custom-front">${COURSES[course].name}・フレーズ *</label><input maxlength="120" required id="custom-front" class="form-input" placeholder="${course==='ko'?'例: 안녕하세요':'例: look forward to'}" /></div><div class="form-group"><label for="custom-back">日本語の意味 *</label><input maxlength="180" required id="custom-back" class="form-input" placeholder="${course==='ko'?'例: こんにちは':'例: 〜を楽しみにする'}" /></div><div class="form-group"><label for="custom-example">例文（任意）</label><input maxlength="250" id="custom-example" class="form-input" placeholder="${course==='ko'?'例: 안녕하세요. 반갑습니다.':'例: I look forward to seeing you.'}" /></div><div class="modal-actions"><button type="button" class="btn btn-white" data-action="close-modal">キャンセル</button><button class="btn" type="submit">追加する</button></div></form></div></div>`;if(modal==='reset')return `<div class="modal-backdrop" data-backdrop="true"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">学習データを初期化しますか？</h2><button class="icon-button" data-action="close-modal" aria-label="閉じる">×</button></div><p class="muted">英語・韓国語の追加カード、学習進捗、回答履歴がすべて削除されます。元に戻せません。先にバックアップすることをおすすめします。</p><div class="modal-actions"><button class="btn btn-white" data-action="close-modal">キャンセル</button><button class="btn btn-danger" data-action="confirm-reset">初期化する</button></div></div></div>`;return ''}
  function render(){const content=view==='home'?homePage():view==='learn'?studyPage():view==='library'?libraryPage():view==='stats'?statsPage():settingsPage();document.getElementById('app').innerHTML=shell(content)+(modal?modalPage():'');if(session?.mode==='typing'&&session.index<session.ids.length&&!session.answered)document.getElementById('answer-input')?.focus()}
  function speak(txt){if(!('speechSynthesis' in window)){toast('このブラウザは音声読み上げに対応していません。');return}try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=COURSES[course].lang;u.rate=course==='ko'?.83:.86;window.speechSynthesis.speak(u)}catch(e){toast('音声を再生できませんでした。')}}
  function exportData(){const blob=new Blob([JSON.stringify({app:'lingo-atelier',...data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='lingo-atelier-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
  async function importData(file){if(!file||file.size>5*1024*1024){toast('5MB以下のJSONファイルを選んでください。');return}let raw;try{raw=JSON.parse(await file.text())}catch(e){toast('JSONファイルの形式が正しくありません。');return}if(raw.app!=='lingo-atelier'||![1,2].includes(raw.version)||!raw.progress||typeof raw.progress!=='object'||Array.isArray(raw.progress)||!Array.isArray(raw.custom)||!Array.isArray(raw.events)||raw.custom.length>5000||raw.events.length>20000){toast('このアプリのバックアップではありません。');return}if(!confirm('現在のデータをバックアップの内容で上書きします。よろしいですか？'))return;const cleanedCustom=raw.custom.filter(c=>c&&typeof c.id==='string'&&typeof c.front==='string'&&typeof c.back==='string').map(c=>({id:c.id.slice(0,100),deck:'custom',lang:c.lang==='ko'?'ko':'en',front:c.front.slice(0,120),back:c.back.slice(0,180),example:String(c.example||'').slice(0,250)}));const safeProgress={};for(const [id,p] of Object.entries(raw.progress).slice(0,10000)){if(typeof id!=='string'||!p||typeof p!=='object')continue;safeProgress[id]={n:Math.max(0,Math.min(10000,Number(p.n)||0)),interval:Math.max(0,Math.min(365,Number(p.interval)||0)),ease:Math.max(1.3,Math.min(3.2,Number(p.ease)||2.5)),due:/^\d{4}-\d{2}-\d{2}$/.test(String(p.due))?p.due:today(),last:String(p.last||''),correct:Math.max(0,Number(p.correct)||0),wrong:Math.max(0,Number(p.wrong)||0)}}data={version:2,course:raw.course==='ko'?'ko':'en',goal:Math.max(1,Math.min(100,Number(raw.goal)||10)),progress:safeProgress,custom:cleanedCustom,events:raw.events.filter(e=>e&&/^\d{4}-\d{2}-\d{2}$/.test(String(e.date))&&typeof e.id==='string').map(e=>({date:e.date,id:e.id,lang:e.lang==='ko'?'ko':'en',correct:!!e.correct,mode:String(e.mode||'cards')}))};course=data.course;DECKS=course==='ko'?DECKS_KO:DECKS_EN;selectedDeck='all';libraryDeck='all';persist();go('home');toast('学習データを復元しました')}
  document.addEventListener('click',e=>{const el=e.target.closest('button,[data-backdrop]');if(!el)return;if(el.dataset.backdrop==='true'&&e.target===el){modal=null;render();return}if(el.dataset.course){switchCourse(el.dataset.course);return}if(el.dataset.nav){go(el.dataset.nav);return}if(el.dataset.deckStart){selectedDeck=el.dataset.deckStart;selectedMode='cards';begin('cards',selectedDeck);return}if(el.dataset.trackDeck){begin(el.dataset.trackMode,el.dataset.trackDeck);return}if(el.dataset.mode){selectedMode=el.dataset.mode;render();return}if(el.dataset.rate){answerCard(el.dataset.rate);return}if(el.dataset.choice){selectAnswer(Number(el.dataset.choice));return}if(el.dataset.speak){const c=allCards().find(c=>c.id===el.dataset.speak);if(c)speak(c.front);return}if(el.dataset.delete){if(confirm('この単語を削除しますか？')){data.custom=data.custom.filter(c=>c.id!==el.dataset.delete);delete data.progress[el.dataset.delete];persist();render();toast('単語を削除しました')}return}const action=el.dataset.action;switch(action){case 'quick-start':begin('output',course==='ko'?'grammar':'tense');break;case 'start-session':begin();break;case 'flip':if(session){session.flipped=true;render()}break;case 'next':next();break;case 'speak':if(session)speak(currentCard().front);break;case 'leave':go('learn');break;case 'restart':begin(session.mode,session.deck);break;case 'add-card':modal='add';render();document.getElementById('custom-front')?.focus();break;case 'close-modal':modal=null;render();break;case 'test-speech':speak(course==='ko'?'안녕하세요. 한국어 공부를 시작해요.':'Hello! Welcome to your English learning journey.');break;case 'export-data':exportData();break;case 'import-data':document.getElementById('import-file')?.click();break;case 'reset-data':modal='reset';render();break;case 'confirm-reset':data=blank();persist();go('home');toast('学習データを初期化しました');break}});
  document.addEventListener('change',e=>{if(e.target.id==='study-deck'){selectedDeck=e.target.value}else if(e.target.id==='library-filter'){libraryDeck=e.target.value;const active=document.activeElement;render();if(active?.id==='library-filter')document.getElementById('library-filter')?.focus()}else if(e.target.id==='daily-goal'){data.goal=Number(e.target.value);persist();toast('1日の目標を変更しました')}else if(e.target.id==='import-file'){importData(e.target.files?.[0]);e.target.value=''}});
  document.addEventListener('input',e=>{if(e.target.id==='library-search'){const sel=e.target.selectionStart;search=e.target.value;render();const box=document.getElementById('library-search');if(box){box.focus();box.setSelectionRange(sel,sel)}}});
  document.addEventListener('submit',e=>{if(e.target.id==='typing-form'){e.preventDefault();typeAnswer()}if(e.target.id==='add-form'){e.preventDefault();const front=document.getElementById('custom-front').value.trim(),back=document.getElementById('custom-back').value.trim(),example=document.getElementById('custom-example').value.trim();if(!front||!back)return;if(data.custom.length>=5000){toast('登録できる単語は最大5000件です');return}const id=course+'-custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);data.custom.push({id,deck:'custom',lang:course,front,back,example});persist();modal=null;libraryDeck='custom';search='';go('library');toast('単語を追加しました')}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;render();return}if(e.target.closest('input,textarea,select,button,[contenteditable]')||modal||!session||view!=='learn')return;if(session.mode==='cards'){if(e.code==='Space'&&!session.flipped){e.preventDefault();session.flipped=true;render()}else if(session.flipped&&['1','2','3','4'].includes(e.key)){answerCard(['again','hard','good','easy'][Number(e.key)-1])}}else if(session.answered&&e.key==='Enter'){e.preventDefault();next()}});
  render();
})();
</script>
<script>
// HTTPS / localhost でのみ PWA のオフラインキャッシュを登録。
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .catch((error) => console.warn('オフラインキャッシュの登録に失敗:', error));
  });
}
</script>
